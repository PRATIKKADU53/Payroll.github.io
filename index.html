<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PayrollPro — Attendance & Payroll Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0d1117;--surface:#161b22;--surface2:#21262d;--surface3:#30363d;
--border:#30363d;--border2:#444c56;
--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
--accent:#00d4aa;--accent2:#00a884;--accent3:#005f4b;
--warn:#f78166;--warn2:#ff6b35;
--info:#79c0ff;--info2:#388bfd;
--gold:#e3b341;--gold2:#d4a017;
--red:#f85149;--green:#3fb950;
--radius:8px;--radius2:12px;--radius3:16px;
--shadow:0 4px 24px rgba(0,0,0,0.4);
}
html{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body{display:flex;min-height:100vh;overflow-x:hidden} /* FIX: prevent horizontal scroll */

/* SIDEBAR */
#sidebar{width:240px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100}
.logo{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.logo-sub{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
nav{padding:16px 0;flex:1;overflow-y:auto}
.nav-group{margin-bottom:8px}
.nav-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:0 20px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:all .15s;color:var(--text2);font-size:13px;font-weight:500;border-left:2px solid transparent}
.nav-item:hover{color:var(--text);background:var(--surface2)}
.nav-item.active{color:var(--accent);background:rgba(0,212,170,.07);border-left-color:var(--accent)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
.version{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}

/* MAIN */
#main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column;max-width:100%;overflow-x:hidden} /* prevent overflow */
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--surface);position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.topbar-actions{display:flex;gap:10px;align-items:center}
.page{padding:28px;display:none;flex:1;min-width:0}
.page.active{display:block}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 0 0 60px;opacity:.08}
.stat-card.teal::before{background:var(--accent)}
.stat-card.gold::before{background:var(--gold)}
.stat-card.red::before{background:var(--red)}
.stat-card.blue::before{background:var(--info)}
.stat-label{font-size:11px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:8px}
.stat-value{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:6px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif}
.btn-primary{background:var(--accent);color:#000;font-weight:600}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:var(--surface3)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-warn{background:var(--gold);color:#000;font-weight:600}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);max-width:100%} /* FIX: ensure table doesn't break width */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead{background:var(--surface2)}
th{padding:11px 14px;text-align:left;font-size:11px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-red{background:rgba(248,81,73,.15);color:var(--red)}
.badge-gold{background:rgba(227,179,65,.15);color:var(--gold)}
.badge-blue{background:rgba(121,192,255,.15);color:var(--info)}
.badge-gray{background:var(--surface3);color:var(--text2)}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:500;color:var(--text2)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;font-size:13px;color:var(--text);font-family:'Inter',sans-serif;transition:border .15s;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
input[type=file]{padding:7px 10px;cursor:pointer}
input[type="color"]{padding:4px;height:36px;width:60px;cursor:pointer}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius3);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface)}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ALERTS */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-info{background:rgba(121,192,255,.1);border:1px solid rgba(121,192,255,.2);color:var(--info)}
.alert-warn{background:rgba(227,179,65,.1);border:1px solid rgba(227,179,65,.2);color:var(--gold)}
.alert-success{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.2);color:var(--green)}
.alert-error{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.2);color:var(--red)}

/* ATTENDANCE CLOCK */
.punch-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:var(--radius3);padding:28px;text-align:center}
.punch-clock{font-family:'DM Mono',monospace;font-size:42px;font-weight:500;color:var(--accent);letter-spacing:3px;margin:12px 0}
.punch-date{font-size:13px;color:var(--text2);margin-bottom:20px;font-family:'DM Mono',monospace}
.punch-status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:20px}
.punch-status.in{background:rgba(63,185,80,.15);color:var(--green)}
.punch-status.out{background:rgba(248,81,73,.15);color:var(--red)}
.pulse{width:8px;height:8px;border-radius:50%;animation:pulse 1.5s infinite}
.pulse.green{background:var(--green)}
.pulse.red{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* PRINT */
@media print{
  #sidebar,#main .topbar,.no-print{display:none!important}
  #main{margin-left:0}
  body{background:#fff;color:#000}
  .page.active{padding:0}
  .print-section{page-break-inside:avoid}
  table,th,td{border-color:#ddd!important}
  th,td{color:#000!important}
  .stat-value,.modal-title,.card-title{color:#000!important}
  .badge-green{background:#e6ffe6!important;color:#155724!important}
  .badge-red{background:#ffe6e6!important;color:#721c24!important}
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  #sidebar { width: 200px; }
  #main { margin-left: 200px; }
}
@media (max-width: 768px) {
  #sidebar { width: 60px; overflow: hidden; }
  #sidebar .logo-mark, #sidebar .logo-sub, #sidebar .nav-label, #sidebar .version { display: none; }
  #sidebar .nav-item { justify-content: center; padding: 12px 0; }
  #sidebar .nav-item svg { margin: 0; }
  #sidebar .nav-item span { display: none; }
  #main { margin-left: 60px; }
  .topbar { padding: 0 16px; }
  .page { padding: 16px; }
  .punch-clock { font-size: 28px; }
}
@media (max-width: 480px) {
  #sidebar { display: none; }
  #main { margin-left: 0; }
  .topbar { padding: 0 12px; flex-wrap: wrap; height: auto; min-height: 56px; }
  .topbar-title { font-size: 13px; }
  .stats-grid { grid-template-columns: 1fr; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .modal { max-width: 95vw; }
  .btn { padding: 6px 12px; font-size: 12px; }
  .card { padding: 12px; }
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700}
.divider{height:1px;background:var(--border);margin:20px 0}
.text-right{text-align:right}
.text-center{text-align:center}
.text-sm{font-size:12px}
.text-mono{font-family:'DM Mono',monospace}
.text-accent{color:var(--accent)}
.text-muted{color:var(--text2)}
.text-warn{color:var(--warn)}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-gold{color:var(--gold)}
.mt-4{margin-top:16px}
.mt-2{margin-top:8px}
.mb-4{margin-bottom:16px}
.gap-2{gap:8px}
.flex{display:flex}
.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* REPORT SPECIFIC */
.report-header{background:linear-gradient(135deg,#003d2e,#005f4b);border-radius:var(--radius2);padding:24px;margin-bottom:20px;color:#fff}
.report-company{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent)}
.report-period{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px;font-family:'DM Mono',monospace}
.report-summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:16px}
.report-sum-item{background:rgba(255,255,255,.08);border-radius:8px;padding:12px;text-align:center}
.report-sum-val{font-family:'Syne',sans-serif;font-size:18px;font-weight:800}
.report-sum-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.7;margin-top:2px;font-family:'DM Mono',monospace}

/* LOAN PROGRESS */
.progress-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text2);margin-bottom:6px}

/* CSV MAPPING */
.mapping-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mapping-field{display:flex;align-items:center;gap:8px}
.mapping-field select{flex:1}
.csv-preview-table{font-size:11px;font-family:'DM Mono',monospace;background:var(--surface2);padding:8px;border-radius:6px;overflow-x:auto}
.csv-preview-table table{min-width:auto;border:none}
.csv-preview-table td{padding:4px 8px;border:none;white-space:nowrap}
</style>
</head>
<body>

<!-- SIDEBAR (unchanged) -->
<aside id="sidebar"> ... same as previous ... </aside>

<!-- MAIN -->
<main id="main">
  <!-- Topbar unchanged -->
  <!-- All pages unchanged up to CSV Import Modal -->

  <!-- CSV Import Modal (enhanced with mapping) -->
  <div class="modal-overlay" id="csv-modal">
    <div class="modal" style="max-width:800px">
      <div class="modal-header">
        <div class="modal-title">Import Biometric CSV</div>
        <button class="modal-close" onclick="closeModal('csv-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info mb-4">
          <div><strong>Works with ANY format!</strong> If auto‑detect fails, you can map columns manually below.</div>
        </div>
        <div class="form-group mb-4">
          <label>CSV File *</label>
          <input type="file" id="csv-file" accept=".csv,.txt" onchange="handleCSVFileSelect(event)"/>
        </div>
        <div id="csv-auto-preview" style="display:none">
          <div class="divider"></div>
          <div class="card-title mb-2">Preview & Column Mapping</div>
          <div class="csv-preview-table" id="csv-preview-table"></div>
          <div class="mapping-grid">
            <div class="mapping-field">
              <label style="width:80px">Emp ID</label>
              <select id="map-empid"><option value="">- Select Column -</option></select>
            </div>
            <div class="mapping-field">
              <label style="width:80px">Name</label>
              <select id="map-name"><option value="">- Optional -</option></select>
            </div>
            <div class="mapping-field">
              <label style="width:80px">Date</label>
              <select id="map-date"><option value="">- Select Column -</option></select>
            </div>
            <div class="mapping-field">
              <label style="width:80px">Time</label>
              <select id="map-time"><option value="">- For punch type format -</option></select>
            </div>
            <div class="mapping-field">
              <label style="width:80px">In Time</label>
              <select id="map-intime"><option value="">- For in/out format -</option></select>
            </div>
            <div class="mapping-field">
              <label style="width:80px">Out Time</label>
              <select id="map-outtime"><option value="">- For in/out format -</option></select>
            </div>
            <div class="mapping-field">
              <label style="width:80px">Punch Type</label>
              <select id="map-punchtype"><option value="">- IN/OUT column -</option></select>
            </div>
          </div>
          <div id="csv-mapping-status" class="mt-2 text-sm"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('csv-modal')">Cancel</button>
        <button class="btn btn-secondary" onclick="autoDetectCSV()">Auto Detect</button>
        <button class="btn btn-primary" onclick="importCSVWithMapping()">Import</button>
      </div>
    </div>
  </div>

  <!-- All other modals unchanged (Employee, Punch, etc.) -->
</main>

<script>
// ... all previous data, navigation, utilities remain the same ...

// ============================================================
// CSV IMPORT (COMPLETELY REWORKED FOR UNIVERSAL FORMATS)
// ============================================================
let csvHeaders = [];
let csvRows = [];
let csvFile = null;

function handleCSVFileSelect(e) {
  csvFile = e.target.files[0];
  if (!csvFile) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const text = ev.target.result;
    parseCSVText(text);
  };
  reader.readAsText(csvFile);
}

function parseCSVText(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length === 0) {
    toast('Empty file', 'error');
    return;
  }
  
  // Try to detect delimiter
  const delim = text.includes(';') ? ';' : (text.includes('\t') ? '\t' : ',');
  
  // Separate header and data rows
  const firstRow = lines[0].split(delim).map(c => c.trim().replace(/"/g, ''));
  // Check if first row is header (contains letters, or typical column names)
  const isHeader = firstRow.some(c => isNaN(+c) && c.length > 0) || 
                   /emp|id|name|date|time|in|out|punch/i.test(firstRow.join(' '));
  
  if (isHeader) {
    csvHeaders = firstRow;
    csvRows = lines.slice(1).map(line => line.split(delim).map(c => c.trim().replace(/"/g, '')));
  } else {
    // No header, generate generic column names
    csvHeaders = firstRow.map((_, i) => `Column ${i+1}`);
    csvRows = lines.map(line => line.split(delim).map(c => c.trim().replace(/"/g, '')));
  }
  
  // Remove empty rows
  csvRows = csvRows.filter(row => row.some(cell => cell.length > 0));
  
  showCSVPreview();
  autoDetectCSV(); // try auto detection
}

function showCSVPreview() {
  document.getElementById('csv-auto-preview').style.display = 'block';
  
  // Build preview table
  const previewDiv = document.getElementById('csv-preview-table');
  let html = '<table><thead><tr>';
  csvHeaders.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
  html += '</tr></thead><tbody>';
  const previewRows = csvRows.slice(0, 5);
  previewRows.forEach(row => {
    html += '<tr>';
    row.forEach(cell => html += `<td>${escapeHtml(cell)}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  previewDiv.innerHTML = html;
  
  // Populate mapping selects
  const selects = ['map-empid', 'map-name', 'map-date', 'map-time', 'map-intime', 'map-outtime', 'map-punchtype'];
  selects.forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">- Select Column -</option>';
    csvHeaders.forEach((h, i) => {
      sel.innerHTML += `<option value="${i}">${h}</option>`;
    });
  });
  // For Name, add "None" option
  document.getElementById('map-name').innerHTML = '<option value="">- Optional -</option>' + csvHeaders.map((h,i) => `<option value="${i}">${h}</option>`).join('');
}

function autoDetectCSV() {
  if (!csvRows.length) return;
  
  // Simple heuristic to map columns
  const lowerHeaders = csvHeaders.map(h => h.toLowerCase());
  
  // Emp ID
  const empIdx = lowerHeaders.findIndex(h => /(emp\s*id|employee\s*id|empno|staff\s*id|id)/i.test(h));
  if (empIdx >= 0) document.getElementById('map-empid').value = empIdx;
  
  // Name
  const nameIdx = lowerHeaders.findIndex(h => /name|employee/i.test(h) && !/(emp\s*id|id|no)/i.test(h));
  if (nameIdx >= 0) document.getElementById('map-name').value = nameIdx;
  
  // Date
  const dateIdx = lowerHeaders.findIndex(h => /date/i.test(h));
  if (dateIdx >= 0) document.getElementById('map-date').value = dateIdx;
  
  // Time / In / Out / PunchType
  const timeIdx = lowerHeaders.findIndex(h => /time/i.test(h) && !/in|out|punch/i.test(h));
  if (timeIdx >= 0) document.getElementById('map-time').value = timeIdx;
  
  const inIdx = lowerHeaders.findIndex(h => /(in\s*time|check\s*in|punch\s*in)/i.test(h));
  if (inIdx >= 0) document.getElementById('map-intime').value = inIdx;
  
  const outIdx = lowerHeaders.findIndex(h => /(out\s*time|check\s*out|punch\s*out)/i.test(h));
  if (outIdx >= 0) document.getElementById('map-outtime').value = outIdx;
  
  const punchIdx = lowerHeaders.findIndex(h => /(punch\s*type|direction|in\s*out|status)/i.test(h));
  if (punchIdx >= 0) document.getElementById('map-punchtype').value = punchIdx;
  
  document.getElementById('csv-mapping-status').innerHTML = 
    '<span class="text-accent">Auto‑detection applied. Adjust if needed.</span>';
}

function importCSVWithMapping() {
  const empIdCol = document.getElementById('map-empid').value;
  const dateCol = document.getElementById('map-date').value;
  
  // Determine which format: punch type (with time + punchtype) or in/out columns
  const timeCol = document.getElementById('map-time').value;
  const inTimeCol = document.getElementById('map-intime').value;
  const outTimeCol = document.getElementById('map-outtime').value;
  const punchTypeCol = document.getElementById('map-punchtype').value;
  
  if (!empIdCol || !dateCol) {
    toast('Emp ID and Date columns are required.', 'error');
    return;
  }
  
  const att = DB.attendance();
  let added = 0, skipped = 0;
  
  // Use the appropriate parser
  if (inTimeCol && outTimeCol) {
    // In/Out columns present
    csvRows.forEach(row => {
      const empId = row[empIdCol]?.trim();
      const date = normalizeDate(row[dateCol]);
      const inTime = normalizeTime(row[inTimeCol]);
      const outTime = normalizeTime(row[outTimeCol]);
      if (!empId || !date || !inTime || !outTime) return;
      
      const totalMins = toMins(outTime) - toMins(inTime);
      if (totalMins < 0) return;
      
      // Check duplicate
      const dup = att.find(a => a.empId === empId && a.date === date && a.source === 'biometric');
      if (dup) { skipped++; return; }
      
      att.push({
        id: uid(), empId, date,
        punchIn: inTime, punchOut: outTime,
        totalMins, source: 'biometric'
      });
      added++;
    });
  } else if (timeCol && punchTypeCol) {
    // Time + PunchType
    csvRows.forEach(row => {
      const empId = row[empIdCol]?.trim();
      const date = normalizeDate(row[dateCol]);
      const time = normalizeTime(row[timeCol]);
      const punchType = row[punchTypeCol]?.trim().toUpperCase();
      if (!empId || !date || !time || !punchType) return;
      
      const isIn = (punchType === 'IN' || punchType === '1' || punchType === 'P' || punchType === 'CHECK IN');
      const isOut = (punchType === 'OUT' || punchType === '0' || punchType === 'M' || punchType === 'CHECK OUT');
      if (!isIn && !isOut) return;
      
      // Find existing record for same emp/date
      let rec = att.find(a => a.empId === empId && a.date === date && a.source === 'biometric');
      if (!rec) {
        rec = { id: uid(), empId, date, punchIn: null, punchOut: null, totalMins: 0, source: 'biometric' };
        att.push(rec);
      }
      if (isIn) rec.punchIn = time;
      else rec.punchOut = time;
      
      if (rec.punchIn && rec.punchOut) {
        rec.totalMins = Math.max(0, toMins(rec.punchOut) - toMins(rec.punchIn));
      }
      added++;
    });
  } else {
    // Fallback: try to treat timeCol as In and guess Out not present, or prompt?
    toast('Could not determine time columns. Please map In Time/Out Time or Time+PunchType.', 'error');
    return;
  }
  
  DB.saveAttendance(att);
  closeModal('csv-modal');
  renderAttendance();
  toast(`Imported ${added} records. ${skipped} duplicates skipped.`);
  csvRows = [];
}

  document.getElementById('csv-auto-preview').style.display = 'none';
  csvRows = [];
  openModal('csv-modal');
}
